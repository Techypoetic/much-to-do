name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rolling deploy to EC2 via SSM
        run: |
          for INSTANCE_ID in $(echo "${{ secrets.EC2_INSTANCE_IDS }}" | tr ',' ' '); do
            echo "Deploying to $INSTANCE_ID..."

            CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands='[
                "cd /opt/much-to-do",
                "git fetch origin main",
                "git reset --hard origin/main",
                "cd Server/MuchToDo",
                "/usr/local/go/bin/go build -o much-to-do-server ./cmd/api",
                "systemctl restart much-to-do",
                "systemctl is-active much-to-do"
              ]' \
              --query "Command.CommandId" --output text)

            aws ssm wait command-executed \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID"

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)

            if [ "$STATUS" != "Success" ]; then
              echo "Deployment failed on $INSTANCE_ID"
              exit 1
            fi

            echo "Successfully deployed to $INSTANCE_ID"
          done
